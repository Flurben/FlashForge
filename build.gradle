plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = 'com.flurben.flashforge'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config', 'flashforge.mixins.json'
            mods { flashforge { source sourceSets.main } }
        }
        client {
            property 'flashforge.selftest', project.findProperty('selftest') ?: ''
        }
    }
}

mixin {
    add sourceSets.main, 'flashforge.refmap.json'
    config 'flashforge.mixins.json'
}

repositories {
    mavenCentral()
    maven {
        url 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ImGui is non-mod library code, so it is shaded (never relocated: JNI symbols are bound to class names).
    shade("io.github.spair:imgui-java-binding:${imgui_version}") { transitive = false }
    shade("io.github.spair:imgui-java-lwjgl3:${imgui_version}") { transitive = false }
    shade("io.github.spair:imgui-java-natives-windows:${imgui_version}") { transitive = false }
    shade("io.github.spair:imgui-java-natives-linux:${imgui_version}") { transitive = false }
    shade("io.github.spair:imgui-java-natives-macos:${imgui_version}") { transitive = false }
    minecraftLibrary("io.github.spair:imgui-java-binding:${imgui_version}") { transitive = false }
    minecraftLibrary("io.github.spair:imgui-java-lwjgl3:${imgui_version}") { transitive = false }
    minecraftLibrary("io.github.spair:imgui-java-natives-windows:${imgui_version}") { transitive = false }

    // Optional integrations: compile against them, resolve at runtime only if present.
    compileOnly fg.deobf('maven.modrinth:distanthorizons:3.3.3-1.20.1') { transitive = false }
    compileOnly fg.deobf('maven.modrinth:embeddium:0.3.31+mc1.20.1') { transitive = false }
    compileOnly fg.deobf('maven.modrinth:oculus:1.20.1-1.8.0') { transitive = false }
}

jar { archiveClassifier = 'slim' }

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    exclude 'META-INF/maven/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'module-info.class'
    from('LICENSE-THIRD-PARTY.md')
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'flashforge.mixins.json'
        )
    }
}

reobf { shadowJar {} }
tasks.named('assemble') { dependsOn 'reobfShadowJar' }
shadowJar.finalizedBy 'reobfShadowJar'

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') { expand 'version': version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
